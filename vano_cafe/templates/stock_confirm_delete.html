<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/confirm.css' %}">
</head>
<body>
    <h1>Are you sure you want to delete {{ product.name }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button delete">Delete</button>
        <a href="{% url 'stock_management' %}" class="button">Cancel</a>
    </form>
</body>
</html>
