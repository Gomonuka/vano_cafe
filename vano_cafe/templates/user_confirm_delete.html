<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/confirm.css' %}">
</head>
<body>
    {% block content %}
    <form method="post">
        <h1>Confirm Deletion</h1>
        <p>Are you sure you want to delete "{{ object.username }}"?</p>
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'user_management' %}">Cancel</a>
    </form>
    {% endblock %}
</body>
</html>
